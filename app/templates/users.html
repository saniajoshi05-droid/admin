{% extends "base.html" %}
{% block content %}
<h2>Customers</h2>
<table>
  <thead>
    <tr><th>Username</th><th>Email</th><th>Balance</th><th>Orders</th></tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td><a href="/users/{{ user.username }}">{{ user.username }}</a></td>
      <td>{{ user.email }}</td>
      <td>${{ user.balance }}</td>
      <td>{{ user.order_count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
